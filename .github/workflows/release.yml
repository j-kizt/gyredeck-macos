name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          # Prefer hand-written notes committed at .github/release-notes.md.
          if [ -s .github/release-notes.md ]; then
            notes="$(cat .github/release-notes.md)"
          else
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            range="${prev:+$prev..}${GITHUB_REF_NAME}"
            commits="$(git log "$range" --no-merges --pretty='- %s' | grep -vE '^- (chore: release|ci:|Merge )' || true)"
            [ -z "$commits" ] && commits="- Maintenance release"
            notes="## What's changed
          $commits"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Universal binary so one download runs on both Apple Silicon and Intel Macs;
          # latest.json then serves both darwin-aarch64 and darwin-x86_64 for auto-update.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Gyredeck __VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
