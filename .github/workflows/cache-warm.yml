name: Warm Rust cache

# GitHub scopes Actions caches per ref: a cache written by the `v1.4.2` tag run is
# invisible to the `v1.5.0` tag run, so the release workflow never got a hit and
# rebuilt the whole dependency tree every time. Only caches written on the default
# branch are readable from every ref — including tags — so warm it here.
#
# This branch MUST stay the repository's default branch. Pointing it anywhere else
# silently restores the every-release-rebuilds-everything behaviour above.
#
# Triggers are deliberately narrow: macOS runners are billed at a premium, and the
# cache only goes stale when the dependency graph changes. The weekly run exists
# because GitHub evicts caches that go unread for 7 days.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - ".github/workflows/cache-warm.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  warm:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Key and paths must stay identical to release.yml or the release run will
      # miss this cache.
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      # tauri's build script expects the frontend dist to exist before cargo runs.
      - name: Build frontend
        run: pnpm --filter @gyredeck/desktop build

      # tauri-build fails on a missing resource, and gyredeck-discord.mjs is built, not
      # committed (adapters/discord/build.mjs), so it must exist before cargo runs.
      - name: Build Discord connector
        run: pnpm discord:build

      # `universal-apple-darwin` is a Tauri pseudo-target: it builds both real
      # targets and lipos them. Build the same two here, in the same profile, so
      # the cached artifacts are the ones the release actually reuses.
      - name: Build Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
