name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # Restores, never saves (#313): setup-node's pnpm cache would otherwise save under the tag.
    cache-mode: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag is the only thing that starts a release, and nothing stopped one being cut
      # from a branch that never merged. The result would be a published, signed build
      # that main does not contain and nobody can reproduce from it — the kind of mistake
      # that is only found later, by someone reading code that was never released.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Build changelog
        id: changelog
        run: |
          # Prefer hand-written notes committed at .github/release-notes.md.
          if [ -s .github/release-notes.md ]; then
            notes="$(cat .github/release-notes.md)"
          else
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            range="${prev:+$prev..}${GITHUB_REF_NAME}"
            commits="$(git log "$range" --no-merges --pretty='- %s' | grep -vE '^- (chore: release|ci:|Merge )' || true)"
            [ -z "$commits" ] && commits="- Maintenance release"
            notes="## What's changed
          $commits"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Restore the cargo registry + build output main's runs keep warm, so release builds
      # don't recompile the whole dependency tree (the slow step). Restore only, never save
      # (#313): this build runs with the signing secrets and writes the Team ID's
      # entitlements under target/signing, so nothing it leaves in target/ is ever cached.
      # Uses the github-owned actions/cache to satisfy the repo's action allowlist.
      - name: Restore Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      # tauri-build fails on a missing resource, and gyredeck-discord.mjs is built, not
      # committed (adapters/discord/build.mjs), so it must exist before cargo runs.
      # tauri's beforeBuildCommand builds it too; this step makes a broken connector
      # build fail here, before the signing steps.
      - name: Build Discord connector
        run: pnpm discord:build

      # Which private key signs a release decides whether every installed copy can accept
      # it, and a published release cannot be taken back. Until this existed, the only
      # thing standing behind that was the current value of a mutable secret.
      #
      # The two are the same key again: the rotation that made them differ is finished.
      # They stay separate parameters because the next rotation will need them to differ
      # again — a release signed by the key going out, carrying the key coming in — and a
      # check that assumes they match cannot express that.
      #
      # Whole public keys, not key ids. An id says which key something claims to be; the
      # thirty-two bytes after it are the key. The first version of this compared ids and
      # would have passed a different key wearing the right one.
      - name: Check the signing key is the one this release expects
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          node scripts/check-signing-key.mjs
          --expect-signing-pubkey dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDNDNTEyMzAxRDU2QUUwMTMKUldRVDRHclZBU05SUEFUV3BWL3o3MHFZL0dNaG9oeXRVbHIvVTBXRTU3elFwd2tnQURHclhkWmgK
          --expect-config-pubkey dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDNDNTEyMzAxRDU2QUUwMTMKUldRVDRHclZBU05SUEFUV3BWL3o3MHFZL0dNaG9oeXRVbHIvVTBXRTU3elFwd2tnQURHclhkWmgK

      # The team's keychain access group needs its entitlement and the provisioning profile
      # inside the app (#288). Both carry the Team ID, so they are written here from secrets.
      - name: Prepare the Developer ID entitlements and profile
        id: signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: echo "config=$(node scripts/ci-signing-config.mjs)" >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary via option_env! for the GitHub device-flow sign-in
          # (a client id is a public identifier, kept out of source as a convenience).
          GYREDECK_GITHUB_CLIENT_ID: ${{ secrets.GYREDECK_GITHUB_CLIENT_ID }}
          # Developer ID signing and notarization (#288): tauri imports the certificate into a
          # keychain of its own for this build and notarizes with an app-specific password.
          # A signed app keeps what it saved in the Keychain across updates; ad-hoc did not.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          # Universal binary so one download runs on both Apple Silicon and Intel Macs;
          # latest.json then serves both darwin-aarch64 and darwin-x86_64 for auto-update.
          args: --target universal-apple-darwin --config ${{ steps.signing.outputs.config }}
          tagName: ${{ github.ref_name }}
          releaseName: "Gyredeck __VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          # A draft until the app it carries is checked below: a release cannot be taken back.
          releaseDraft: true
          prerelease: false

      # What is published must be what an update can trust (#288): Developer ID, not ad-hoc;
      # both architectures; hardened runtime; notarized with the ticket stapled; accepted by
      # Gatekeeper. Any miss leaves the release a draft.
      - name: Check the app is signed, notarized and universal
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Gyredeck.app
          codesign --verify --strict --deep "$app"
          details=$(codesign -dv --verbose=2 "$app" 2>&1)
          grep -q "^Authority=Developer ID Application: " <<<"$details"
          grep -q "flags=.*runtime" <<<"$details"
          if grep -q "^Signature=adhoc" <<<"$details"; then exit 1; fi
          grep -qF "Authority=$APPLE_SIGNING_IDENTITY" <<<"$details"
          # The pinned certificate, not only one the secrets name: a renewed or wrong one fails here.
          node scripts/check-signer.mjs "$app"
          archs=$(lipo -archs "$app/Contents/MacOS/gyredeck-desktop")
          grep -qw arm64 <<<"$archs" && grep -qw x86_64 <<<"$archs"
          test -f "$app/Contents/embedded.provisionprofile"
          codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -q "keychain-access-groups"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
