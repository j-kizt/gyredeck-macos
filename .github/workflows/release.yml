name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          # Prefer hand-written notes committed at .github/release-notes.md.
          if [ -s .github/release-notes.md ]; then
            notes="$(cat .github/release-notes.md)"
          else
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            range="${prev:+$prev..}${GITHUB_REF_NAME}"
            commits="$(git log "$range" --no-merges --pretty='- %s' | grep -vE '^- (chore: release|ci:|Merge )' || true)"
            [ -z "$commits" ] && commits="- Maintenance release"
            notes="## What's changed
          $commits"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Cache the cargo registry + build output so release builds don't recompile
      # the whole dependency tree from scratch each run (the slow step).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary via option_env! for the GitHub device-flow sign-in
          # (a client id is a public identifier, kept out of source as a convenience).
          GYREDECK_GITHUB_CLIENT_ID: ${{ secrets.GYREDECK_GITHUB_CLIENT_ID }}
        with:
          projectPath: apps/desktop
          # Universal binary so one download runs on both Apple Silicon and Intel Macs;
          # latest.json then serves both darwin-aarch64 and darwin-x86_64 for auto-update.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Gyredeck __VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
