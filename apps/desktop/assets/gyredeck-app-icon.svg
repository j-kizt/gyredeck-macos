<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Gyredeck mark: an open gyre around a still core. The 60° gap sits at the
       upper right so the ring reads as turning rather than as a plain circle,
       and the single-hue gradient keeps it legible down to 16px in the menu bar. -->
  <defs>
    <linearGradient id="gyre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B5FA8"/>
      <stop offset="1" stop-color="#4BA3C7"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="#0E1726"/>
  <path d="M 748.7 448.6 A 245 245 0 1 1 575.4 275.3"
        fill="none" stroke="url(#gyre)" stroke-width="92" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="86" fill="#7EC8E3"/>
</svg>
