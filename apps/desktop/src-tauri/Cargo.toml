[package]
name = "gyredeck-desktop"
version = "0.1.6"
description = "Gyredeck desktop presence overlay"
authors = ["Mahiro"]
edition = "2021"

[lib]
name = "gyredeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.1"
libc = "=0.2.186"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSScreen", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSCalendar", "NSDate", "NSDictionary", "NSGeometry", "NSObject", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }
security-framework = "3.5.1"
