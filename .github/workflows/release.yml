name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag is the only thing that starts a release, and nothing stopped one being cut
      # from a branch that never merged. The result would be a published, signed build
      # that main does not contain and nobody can reproduce from it — the kind of mistake
      # that is only found later, by someone reading code that was never released.
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Merge the release PR first, then tag the merge commit."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Build changelog
        id: changelog
        run: |
          # Prefer hand-written notes committed at .github/release-notes.md.
          if [ -s .github/release-notes.md ]; then
            notes="$(cat .github/release-notes.md)"
          else
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            range="${prev:+$prev..}${GITHUB_REF_NAME}"
            commits="$(git log "$range" --no-merges --pretty='- %s' | grep -vE '^- (chore: release|ci:|Merge )' || true)"
            [ -z "$commits" ] && commits="- Maintenance release"
            notes="## What's changed
          $commits"
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$notes"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Cache the cargo registry + build output so release builds don't recompile
      # the whole dependency tree from scratch each run (the slow step). Uses the
      # github-owned actions/cache to satisfy the repo's action allowlist.
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      # tauri-build fails on a missing resource, and gyredeck-discord.mjs is built, not
      # committed (adapters/discord/build.mjs), so it must exist before cargo runs.
      # tauri's beforeBuildCommand builds it too; this step makes a broken connector
      # build fail here, before the signing steps.
      - name: Build Discord connector
        run: pnpm discord:build

      # Which private key signs a release decides whether every installed copy can accept
      # it, and a published release cannot be taken back. Until this existed, the only
      # thing standing behind that was the current value of a mutable secret.
      #
      # The two are the same key again: the rotation that made them differ is finished.
      # They stay separate parameters because the next rotation will need them to differ
      # again — a release signed by the key going out, carrying the key coming in — and a
      # check that assumes they match cannot express that.
      #
      # Whole public keys, not key ids. An id says which key something claims to be; the
      # thirty-two bytes after it are the key. The first version of this compared ids and
      # would have passed a different key wearing the right one.
      - name: Check the signing key is the one this release expects
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >
          node scripts/check-signing-key.mjs
          --expect-signing-pubkey dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDNDNTEyMzAxRDU2QUUwMTMKUldRVDRHclZBU05SUEFUV3BWL3o3MHFZL0dNaG9oeXRVbHIvVTBXRTU3elFwd2tnQURHclhkWmgK
          --expect-config-pubkey dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDNDNTEyMzAxRDU2QUUwMTMKUldRVDRHclZBU05SUEFUV3BWL3o3MHFZL0dNaG9oeXRVbHIvVTBXRTU3elFwd2tnQURHclhkWmgK

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the binary via option_env! for the GitHub device-flow sign-in
          # (a client id is a public identifier, kept out of source as a convenience).
          GYREDECK_GITHUB_CLIENT_ID: ${{ secrets.GYREDECK_GITHUB_CLIENT_ID }}
        with:
          projectPath: apps/desktop
          # Universal binary so one download runs on both Apple Silicon and Intel Macs;
          # latest.json then serves both darwin-aarch64 and darwin-x86_64 for auto-update.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: "Gyredeck __VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
