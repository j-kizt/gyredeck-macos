name: CI

# Nothing verified pull requests before this workflow existed: seven Playwright specs
# had been failing since the v1.0.0 rebrand and a null-guard regression white-screened
# the whole panel, both unnoticed because the suite only ever ran on a developer's
# machine. These jobs are the ones named in the branch ruleset for main.

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a rapid re-push should not leave stale runs burning macOS minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Same key and paths as release.yml and cache-warm.yml, so all three share one
      # cache entry rather than each warming its own.
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript and workspace check
        run: pnpm check

      - name: Rust check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Hook integration tests
        run: pnpm test:hooks

  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # The suite drives real Chrome (playwright.config.ts pins channel: "chrome"),
      # which the runner image does not ship.
      - name: Install Chrome for Playwright
        run: pnpm exec playwright install --with-deps chrome

      - name: Browser demo regression
        run: pnpm test:demo

      # Playwright's own line reporter output is in the step log. Uploading the HTML
      # report would need actions/upload-artifact, which this repo's action allowlist
      # has never admitted — add it there first if the logs prove not to be enough.
      - name: Summarise failures
        if: failure()
        run: |
          echo "Playwright failed. Re-run locally with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'pnpm test:demo' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not run `pnpm desktop:dev` at the same time — Playwright reuses that' >> "$GITHUB_STEP_SUMMARY"
          echo 'vite server and its workers then hang at teardown.' >> "$GITHUB_STEP_SUMMARY"
